<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Apigon terminal demo</title>
  <desc id="desc">Terminal-style screenshot showing Apigon reporting vulnerable authorization checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="980" height="620" rx="18" fill="url(#bg)" />
  <rect x="20" y="20" width="940" height="48" rx="12" fill="#1f2937" />
  <circle cx="52" cy="44" r="8" fill="#ef4444" />
  <circle cx="78" cy="44" r="8" fill="#f59e0b" />
  <circle cx="104" cy="44" r="8" fill="#22c55e" />
  <text x="490" y="50" fill="#cbd5e1" font-family="monospace" font-size="20" text-anchor="middle">apigon demo</text>

  <g font-family="monospace" font-size="24">
    <text x="44" y="112" fill="#93c5fd">$ python main.py --config config.json</text>
    <text x="44" y="164" fill="#f8fafc">apigon - authorization test results</text>
    <text x="44" y="206" fill="#22c55e">[bola_read] VULNERABLE</text>
    <text x="76" y="240" fill="#cbd5e1">target_id: 41</text>
    <text x="76" y="274" fill="#cbd5e1">attack_status: 200</text>
    <text x="44" y="322" fill="#22c55e">[bola_update] VULNERABLE</text>
    <text x="76" y="356" fill="#cbd5e1">attack_status: 200</text>
    <text x="44" y="404" fill="#22c55e">[bfla] VULNERABLE</text>
    <text x="76" y="438" fill="#cbd5e1">attack_status: 200</text>
    <text x="44" y="492" fill="#f87171">overall verdict: VULNERABLE</text>
    <text x="44" y="544" fill="#fbbf24">$ echo $?   # 1 when any finding is present</text>
    <text x="44" y="578" fill="#f8fafc">1</text>
  </g>
</svg>
